name: Atualizar cotações
on:
  schedule:
    - cron: "*/15 12-22 * * 1-5"
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 atualizar_cotacoes.py
      - run: |
          git config user.name "cotacoes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cotacoes.json
          git diff --staged --quiet || (git commit -m "cotações" && git push)
